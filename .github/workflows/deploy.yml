name: Build and deploy both team sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npm run lint

      - name: Build sales and tech variants
        run: |
          npm run build:sales
          npm run build:tech

      - name: Deploy sales site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: dist-sales

      - name: Deploy tech site to its existing main branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          repository-name: BIKMIM/Diosem_Workers
          branch: main
          folder: dist-tech
          clean: true
          clean-exclude: |
            README.md
            CLAUDE.md
